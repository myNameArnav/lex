name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Formatting and dependency consistency
        run: |
          test -z "$(gofmt -l cmd internal web)"
          go mod tidy
          git diff --exit-code -- go.mod go.sum
      - name: Tests and static checks
        run: |
          go test -race ./...
          go vet ./...
          for file in web/static/js/*.js; do node --input-type=module --check < "$file"; done
          bash -n deploy/deploy.sh
          docker compose config --quiet
          docker compose -f docker-compose.yml -f docker-compose.rpi.yml config --quiet
      - name: Publication privacy checks
        run: python3 scripts/check-publication.py
      - name: Secret scanning
        run: |
          go run github.com/zricethezav/gitleaks/v8@v8.30.1 git --redact --no-banner --log-opts="HEAD" .
          go run github.com/zricethezav/gitleaks/v8@v8.30.1 dir --redact --no-banner .
      - name: Vulnerability scanning
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...
      - name: Linux builds
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -o build/lex-linux-amd64 ./cmd/lex
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -o build/lex-linux-arm64 ./cmd/lex
      - name: Container build
        run: docker build --build-arg RPI_FFMPEG=no -t lex:ci .
